[package]
name = "passport-photo-printer"
version = "1.0.0"
edition = "2021"
description = "A powerful, high-precision passport and visa photo grid composer, editor, and print studio in Rust."
authors = ["Sanat Bhadauria"]

[dependencies]
clap = { version = "4.5.53", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
cairo-rs = { version = "0.21.5", features = ["pdf", "png"] }
gdk-pixbuf = "0.21.5"
open = "3.2.0"
